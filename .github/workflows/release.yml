name: Release

# Runs after a merge to main and cuts a release WITHOUT writing back to the
# branch:
#   1. build all agent artifacts and run validation + smoke tests as a final gate
#   2. read the release version from the committed Claude manifest (the single
#      source of truth — version bumps happen in the PR, not here)
#   3. if no tag exists for that version yet, package each agent's plugin bundle
#      and publish a GitHub Release. `gh release create` creates the tag
#      server-side, so nothing is pushed to the protected `main` branch.
#
# Why no commit-back: `main` is governed by a repository ruleset (require pull
# request + required signatures + no force-push). A workflow pushing generated
# artifacts straight to main is rejected by that ruleset. Instead, the generated
# artifacts (skills/, dist/, plugins/) are committed as part of each PR and
# enforced up to date by verify-build.yml. This workflow only validates and tags.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Validate & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 1. Final gate: the committed artifacts must build, validate and smoke-test
      #    cleanly. (PRs already enforce this; we re-check before tagging.)
      - name: Build all agents
        run: bash scripts/build.sh all

      - name: Validate generated files
        run: python3 scripts/validate.py

      - name: Smoke test
        run: bash tests/build_test.sh

      # 2. The release version is whatever the merged Claude manifest declares.
      - name: Resolve version from manifest
        id: version
        run: |
          set -euo pipefail
          version="$(jq -r '.version' .claude-plugin/plugin.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not read .version from .claude-plugin/plugin.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Release version: v$version"

      - name: Check whether tag already exists
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists — nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 3. Package each agent's marketplace bundle as a release asset. The repo
      #    tree remains the primary distribution (the marketplace installs from
      #    ./plugins/<agent>/); these archives are a convenience for direct
      #    downloads and pinning to a tag.
      - name: Package plugin bundles
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for agent in claude codex augment junie roo; do
            src="plugins/${agent}/spec-driven-development"
            [ -d "$src" ] || { echo "::error::missing bundle: $src"; exit 1; }
            tar -czf "release-assets/sdd-${agent}-v${VERSION}.tar.gz" \
              -C "plugins/${agent}" spec-driven-development
          done
          ls -l release-assets

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
